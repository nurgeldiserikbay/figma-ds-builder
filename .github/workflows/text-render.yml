name: Текст на Windows (эксперимент)

# Сравнение рендера текста с эталоном Figma на Windows при разных настройках Chrome.
on: workflow_dispatch

jobs:
  measure:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: chrome
        uses: browser-actions/setup-chrome@v1
        with: { chrome-version: stable }
      - run: npm run setup
      - name: Варианты
        shell: bash
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          cd packages/bench
          for v in "" "--text-contrast=0 --text-gamma=1000" "--text-contrast=50 --text-gamma=1200" "--disable-font-subpixel-positioning" "--enable-font-antialiasing --text-contrast=0"; do
            echo "=== DS_CHROME_ARGS='$v'"
            DS_CHROME_ARGS="$v" node src/run.js --only hackrpi-thankyou --runs 1 2>&1 | grep -E "^\| hackrpi-thankyou \| v(2.1|3)" || true
          done

name: Тесты

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
        exclude:
          # macOS-минуты дороже: одна версия Node достаточно
          - os: macos-latest
            node: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Установка (npm run setup)
        run: npm run setup

      - name: Тесты программы и плагина
        run: npm test
        timeout-minutes: 15
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          # на macOS тест зависал без вывода — подробный журнал браузера, чтобы видеть, где
          DEBUG: ${{ runner.os == 'macOS' && 'pw:browser,pw:api' || '' }}

      - name: Сборка из zip (путь с пробелами и тире, как называет плагин)
        shell: bash
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          cd packages/builder/fixtures/sample
          node -e "
            const fs=require('fs'),path=require('path');
            // простой zip без сжатия — тот же формат, что собирает плагин
            const files=[];(function w(d,p=''){for(const n of fs.readdirSync(d)){const f=path.join(d,n),r=p?p+'/'+n:n;fs.statSync(f).isDirectory()?w(f,r):files.push([r,fs.readFileSync(f)])}})('.');
            const T=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):c>>>1;T[n]=c>>>0}
            const crc=b=>{let c=0xffffffff;for(const x of b)c=T[(c^x)&255]^(c>>>8);return(c^0xffffffff)>>>0};
            const parts=[],cen=[];let off=0;
            for(const[n,d]of files){const nm=Buffer.from(n),h=Buffer.alloc(30),c=crc(d);h.writeUInt32LE(0x04034b50,0);h.writeUInt16LE(20,4);h.writeUInt16LE(0x800,6);h.writeUInt32LE(c,14);h.writeUInt32LE(d.length,18);h.writeUInt32LE(d.length,22);h.writeUInt16LE(nm.length,26);parts.push(h,nm,d);
              const e=Buffer.alloc(46);e.writeUInt32LE(0x02014b50,0);e.writeUInt16LE(20,4);e.writeUInt16LE(20,6);e.writeUInt16LE(0x800,8);e.writeUInt32LE(c,16);e.writeUInt32LE(d.length,20);e.writeUInt32LE(d.length,24);e.writeUInt16LE(nm.length,28);e.writeUInt32LE(off,42);cen.push(e,nm);off+=30+nm.length+d.length}
            const cs=Buffer.concat(cen),end=Buffer.alloc(22);end.writeUInt32LE(0x06054b50,0);end.writeUInt16LE(files.length,8);end.writeUInt16LE(files.length,10);end.writeUInt32LE(cs.length,12);end.writeUInt32LE(off,16);
            fs.writeFileSync(path.join(process.env.RUNNER_TEMP,'Sample file — ds-package.zip'),Buffer.concat([...parts,cs,end]));"
          cd "$GITHUB_WORKSPACE"
          npm run ds -- build "$RUNNER_TEMP/Sample file — ds-package.zip" --out "$RUNNER_TEMP/out site"
          test -f "$RUNNER_TEMP/out site/report.html"
          test -f "$RUNNER_TEMP/out site/design-system/tokens.json"

      - name: Отчёт при ошибке
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.os }}-node${{ matrix.node }}
          path: |
            packages/builder/out
            ${{ runner.temp }}/out site
          if-no-files-found: ignore
